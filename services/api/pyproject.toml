[project]
name = "mangatranslate-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pgserver>=0.1.4", "moto[s3]>=5.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"mtapi/emails.py" = ["E501"]  # message templates
"migrations/*" = ["E501"]
"mtapi/config.py" = ["S105"]  # dev-only defaults; Settings.check() refuses them in production

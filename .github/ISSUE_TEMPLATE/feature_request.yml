name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Alternatives you considered are welcome.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "apps/web (Next.js UI)"
        - "services/api (FastAPI)"
        - "services/worker (translation pipeline)"
        - "infra (Docker / compose / deploy)"
        - "docs"
    validations:
      required: true

# main → build and push images → deploy to staging automatically.
# Production deploys only via "Run workflow" with deploy_production=true, gated by the GitHub "production"
# environment (configure required reviewers there). See docs/DEPLOYMENT.md.
name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production: { description: "Deploy this commit to production", type: boolean, default: false }

permissions: { contents: read, packages: write }

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The exported segmenter ONNX is not distributed (see docs/MODEL_LICENSES.md). Without the private
      # SEGMENTER_ONNX_URL secret, public images are built with the model-free text mask (SEGMENTER=none).
      WORKER_SEGMENTER_ARGS: ${{ secrets.SEGMENTER_ONNX_URL != '' && format('--build-arg SEGMENTER_ONNX_URL={0}', secrets.SEGMENTER_ONNX_URL) || '--build-arg SEGMENTER=none' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          docker build -f infra/docker/api.Dockerfile -t $REGISTRY/api:$TAG .
          docker build -f infra/docker/worker.Dockerfile $WORKER_SEGMENTER_ARGS -t $REGISTRY/worker:$TAG .
          docker build --build-arg ORT_PACKAGE="onnxruntime-gpu[cuda,cudnn]==1.24.4" -f infra/docker/worker.Dockerfile \
            $WORKER_SEGMENTER_ARGS -t $REGISTRY/worker-gpu:$TAG .
          docker build --build-arg API_URL=http://api:8000 --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.SITE_URL }}" -t $REGISTRY/web:$TAG apps/web
          for i in api worker worker-gpu web; do docker push $REGISTRY/$i:$TAG; done

  staging:
    needs: build
    # Opt-in: set the repo variable DEPLOY_STAGING=true plus the staging environment secrets
    # (DEPLOY_SSH_KEY, DEPLOY_HOST) to enable automatic deploys. Left off on a fresh public repo.
    if: vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: deploy
        env: { SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", HOST: "${{ secrets.DEPLOY_HOST }}" }
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new deploy@$HOST "cd /srv/mangatranslate && TAG=$TAG ./deploy.sh"

  production:
    needs: staging
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: deploy
        env: { SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", HOST: "${{ secrets.DEPLOY_HOST }}" }
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new deploy@$HOST "cd /srv/mangatranslate && TAG=$TAG ./deploy.sh"

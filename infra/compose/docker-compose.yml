# Local development stack. No production credentials needed: MinIO stands in for R2, the dev payment provider
# for payOS, and e-mails are printed to the api/worker logs.
#   docker compose -f infra/compose/docker-compose.yml up --build
# Web http://localhost:3000 · API docs http://localhost:8000/api/docs · MinIO console http://localhost:9001
name: mangatranslate

x-backend-env: &backend-env
  APP_ENV: local
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mangatranslate
  AUTH_SECRET: local-dev-secret-not-for-production
  WEB_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: mangatranslate
  S3_REGION: us-east-1
  PAYMENT_PROVIDERS: dev
  EMAIL_PROVIDER: console

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mangatranslate
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/mangatranslate &&
             mc ilm rule add --expire-days 1 --prefix 'uploads/' local/mangatranslate &&
             mc ilm rule add --expire-days 60 --prefix 'users/' local/mangatranslate || true"

  migrate:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        SEGMENTER: ${SEGMENTER:-none}
        SEGMENTER_ONNX_URL: ${SEGMENTER_ONNX_URL:-}
    environment:
      <<: *backend-env
      WORKER_QUEUES: default,gpu
      # AI providers (seeded into the providers table on first start; edit later in /admin/providers)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gpt-5.4-mini}
      OCR_BASE_URL: ${OCR_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      OCR_MODEL: ${OCR_MODEL:-qwen3-vl-flash}
      OCR_API_KEY_ENV: ${OCR_API_KEY_ENV:-DASHSCOPE_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  web:
    build: { context: ../../apps/web }
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
